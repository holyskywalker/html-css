<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        th {
            border: 1px solid black;
            padding: 4px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th colspan="4">A</th>
            <th rowspan="4">B</th>
        </tr>

        <tr>
            <th rowspan="4">C</th>
            <th>D</th>
            <th>E</th>
            <th>F</th>
        </tr>

        <tr>
            <th>G</th>
            <th>H</th>
            <th>I</th>
        </tr>

        <tr>
            <th>J</th>
            <th>K</th>
            <th>L</th>
        </tr>

        <tr>
            <th colspan="4">M</th>
        </tr>
    </table>
</body>
</html>
