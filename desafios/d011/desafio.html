<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 11</title>
    <style>
        * {
            padding: 0px 0px;
            margin: 0;
        }

        #fundo {
            position: relative;
            background: darkblue url('images/espaco.jpg') left top no-repeat fixed;
            background-size: cover;
            height: 100vh;
        }

        #astronauta {
            

            background: url('images/astronauta.png') left top no-repeat;
            background-size: 450px;
            height: 500px;
            width: 500px;

            position: absolute;
            left: 50%;
            right: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <article id="fundo">
        <section id="astronauta">

        </section>
    </article>
</body>
</html>
