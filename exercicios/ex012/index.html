<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <h2>Forma 1</h2>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
    <video src="midia/Meu-Video.m4v" width="560" controls></video>
    <h2>Forma 2</h2>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
    <video width="560" poster="imagens/limoes-capa.png" controls loop> <!-- PARÂMETROS TIPO NOS AUDIOS, CONTROLS, LOOP, AUTOPLAY... ETC, MAS AGORA TEM O "POSTER" QUE SERVE PRA COLOCAR A CAPA PRO VÍDEO, TIPO THUMBNAIL-->
        <source src="midia/meu-video.mp4" type="video/mp4">
        <source src="midia/Meu-Video.webm" type="video/webm"> <!-- ORDEM POR TAMANHO DO ARQUIVO, MAS CASO NENHUM DELES FUNCIONE PRO NAVEGADOR, VAI APARECER O PARÁGRAFO. ELE VAI CARREGANDO UM POR UM, SE O PRIMEIRO NÃO FUNCIONAR, CARREGA O 2, SE NÃO CARREGAR O 2, CARREGA O 3, E ASSIM VAI.-->
        <source src="midia/Meu-Video.m4v" type="video/m4v">
        <source src="midia/Meu-Video.ogv" type="video/ogg">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>
    </video>
    <h1>Inserindo vídeos do YouTube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/T5vdPy7nbRQ?si=5_mrm-batcB2sHxQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
