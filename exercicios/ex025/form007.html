<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="iestado">Estado: </label>
            <select name="estado" id="iestado" required>
                <option value="" selected>--- Escolha ---</option>
                <optgroup label="Estados Desenvolvidos">
                    <option value="SP">São Paulo</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                </optgroup>
                <optgroup label="Estados em Desenvolvimento">
                    <option value="MA">Maranhão</option>
                    <option value="PI">Piauí</option>
                    <option value="BA">Bahia</option>
                    <option value="MG">Mato Grosso</option>
                </optgroup>
            </select>
        </p>

        <p>
            <label for="iprofissao">Profissão: </label>
            <input type="text" name="profissao" id="iprofissao" list="listprof" required>
            <datalist id="listprof">
                <option>Professor</option>
                <option>Médico</option>
                <option>Agricultor</option>
                <option>Investidor</option>
                <option>Vendedor</option>
                <option>Cozinheiro</option>
                <option>Motorista</option>
                <option>Entregador</option>
                <option>Não fixa</option>
            </datalist>
        </p>

        <p>
            <label for="imsg">Mensagem: </label> <br>
            <textarea name="msg" id="imsg" cols="30" rows="10">Digite aqui</textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
