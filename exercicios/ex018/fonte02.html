<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Soloist';
            src: url(fontes/soloist1.ttf) format('truetype');
            font-weight: normal;
            font-style: normal;
            /*
            Tipos de format()
            - opentype (otf, mas algumas são .ttf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Tipography)
            - svg
            */
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            font-family: 'Soloist', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>STAR WARS</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Beatae pariatur ipsum nostrum voluptatem aliquam quam quae rerum error aliquid, velit deserunt doloremque dolor magnam delectus minima quidem natus, minus amet.</p>
</body>
</html>
